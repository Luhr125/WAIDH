<!doctype html>
<!--
  HTML enthält das Grundgerüst der Webseite.
  Das eigentliche Spiel wird nicht mit einzelnen HTML-Elementen gebaut,
  sondern von JavaScript auf die Canvas-Zeichenfläche gemalt.
-->
<html lang="de">
  <head>
    <!-- UTF-8 erlaubt unter anderem deutsche Umlaute. -->
    <meta charset="UTF-8" />
    <!-- Sorgt dafür, dass die Seite auch auf kleinen Bildschirmen korrekt skaliert. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No Safe Step</title>
    <!-- Verbindet diese HTML-Datei mit dem Aussehen aus der CSS-Datei. -->
    <link rel="stylesheet" href="style 1.css" />
  </head>
  <body>
    <!-- game-shell fasst Überschrift, Spielfeld und Bedienungshinweise zusammen. -->
    <main class="game-shell">
      <header>
        <div>
          <h1>NO SAFE STEP</h1>
        </div>
        <!-- JavaScript schreibt hier Meldungen wie "WARTE AUF P2" hinein. -->
        <div id="barrier-status" class="barrier-status" aria-live="polite"></div>
        <!-- Die IDs werden in JavaScript verwendet, um beide Todeszahlen zu aktualisieren. -->
        <div class="stats" aria-live="polite">
          <span>P1 TODE <b id="p1-deaths">0</b></span>
          <span>P2 TODE <b id="p2-deaths">0</b></span>
        </div>
      </header>

      <section class="game-frame" aria-label="Spielfeld">
        <!--
          Canvas ist eine leere, zweidimensionale Zeichenfläche.
          Ihr internes Koordinatensystem ist 1400 x 820 Pixel groß.
          Der Punkt (0,0) liegt oben links; X wächst nach rechts und Y nach unten.
        -->
        <canvas id="game" width="1400" height="820"></canvas>
        <!-- Diese Ebene wird nach einem Sieg über das Canvas gelegt. -->
        <div id="message" class="message hidden"></div>
      </section>

      <!-- Kurze Erklärung der beiden Steuerungen und des Checkpoint-Systems. -->
      <footer>
        <span>P1: <kbd>WASD</kbd> · P2: <kbd>← ↑ ↓ →</kbd></span>
        <span>Bringe <i class="coin-dot"></i> Münzen zum Checkpoint-Viereck, um sie zu sichern.</span>
      </footer>
    </main>
    <!-- Die Spiellogik wird zuletzt geladen. ?v=4 verhindert eine alte Browser-Cache-Version. -->
    <script src="game 1.js?v=4"></script>
  </body>
</html>
